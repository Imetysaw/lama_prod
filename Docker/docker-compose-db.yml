# Database (+ PhpMyAdmin) only, for running the backend and frontend locally
# without docker (flask run / ng serve).
name: lama-dev
services:
  lama-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mysqlData:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  lama-phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: ${DB_HOSTNAME}
      PMA_PORT: ${DB_PORT}
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    depends_on:
      lama-db:
        condition: service_healthy

volumes:
  mysqlData:
