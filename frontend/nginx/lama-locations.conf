# Locations shared by the HTTP and HTTPS server blocks.

# Uploaded artifact files can be larger than nginx's 1 MB default
client_max_body_size 50m;

# The API (Flask/gunicorn). The /api prefix is stripped before proxying.
location /api/ {
    proxy_pass http://lama-flask:5000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# The Angular app
location / {
    root   /usr/share/nginx/html;
    index  index.html;
    # Use angular routing
    try_files $uri $uri/ /index.html;
}

# Never cache index.html, so a new deployment is picked up immediately
location = /index.html {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/lama/security-headers.conf;
}

error_page   500 502 503 504  /50x.html;
location = /50x.html {
    root   /usr/share/nginx/html;
}
