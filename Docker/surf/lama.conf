# LaMa behind the nginx of a SURF Research Cloud workspace.
#
# SURF's nginx already terminates HTTPS (with a certificate it manages) and includes
# /etc/nginx/app-location-conf.d/*.conf in its HTTPS server block. Install with:
#
#   sudo cp Docker/surf/lama.conf /etc/nginx/app-location-conf.d/lama.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# and run LaMa with, in .env.prod:
#   NGINX_MODE=http  BIND_ADDRESS=127.0.0.1  HTTP_PORT=8080  HTTPS_PORT=8443

location / {
    # Optional: only let members of your SURF collaboration reach LaMa (on top of
    # LaMa's own login), using SURF's /etc/nginx/app-location-conf.d/authentication.conf.
    # Check that file for how it is meant to be used before enabling these lines.
    # auth_request /validate;
    # error_page 401 = @custom_401;
    # error_page 403 = @access_not_allowed;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Artifact uploads can be larger than nginx's 1 MB default
    client_max_body_size 50m;
}
